name: build wheel for release

on:
  release:
    types: [published]
  # allow the test CI to be manually triggerred
  workflow_dispatch:

permissions:
  contents: write # upload artifacts requires this permission

jobs:
  build_wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup python environment
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # use the minimum py ver we support to
          # generate the wheel.
          python-version: "3.10"

      - name: Install build deps
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -U hatch

      - name: Build otaclient IoT logging server package
        run: |
          hatch build -t wheel

      - name: Build otaclient IoT logging server proto package
        run: |
          pushd proto
          hatch build -t wheel
          popd
          cp proto/dist/*.whl dist

      - name: calculate checksum
        run: |
          for WHL in dist/*.whl; \
            do \
              sha256sum ${WHL} | sed -E "s@(\w+)\s+.*@sha256:\1@" > \
                ${WHL}.checksum; \
            done

      - name: Upload built wheel as release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.whl
            dist/*.checksum
