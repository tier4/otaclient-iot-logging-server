name: test CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  # allow the test CI to be manually triggerred
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  pytest_with_coverage_on_supported_os:
    permissions:
      contents: read
      pull-requests: write # for the coverage report comment
    strategy:
      fail-fast: true
      matrix:
        # currently we only need to ensure it is running on the following OS
        # with OS-shipped python interpreter.
        os: ["ubuntu-22.04", "ubuntu-24.04"]
        include:
          - os: ubuntu-22.04
            python_version: "3.10"
          - os: ubuntu-24.04
            python_version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # sonarcloud needs main branch's ref
          fetch-depth: 0
          persist-credentials: false

      # also see https://docs.astral.sh/uv/guides/integration/github/#multiple-python-versions
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python_version }}
          enable-cache: true

      - name: Execute pytest with coverage
        run: |
          uv run --python python3 --no-managed-python coverage run -m pytest --junit-xml=test_result/pytest.xml
          uv run --python python3 --no-managed-python coverage xml -o test_result/coverage.xml

      # export the coverage report to the comment!
      - name: Add coverage report to PR comment
        if: matrix.os == 'ubuntu-24.04' && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@9516bf7f32a9229cf18d5e1717ae387c7154f279 # v1.13.0
        with:
          pytest-xml-coverage-path: test_result/coverage.xml
          junitxml-path: test_result/pytest.xml

      - name: SonarCloud Scan
        if: matrix.os == 'ubuntu-24.04'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        # best-effort: a missing or invalid SONAR_TOKEN must not fail CI
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  pytest_on_supported_python_vers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # also see https://docs.astral.sh/uv/guides/integration/github/#multiple-python-versions
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Execute pytest via uv
        run: uv run -m pytest
